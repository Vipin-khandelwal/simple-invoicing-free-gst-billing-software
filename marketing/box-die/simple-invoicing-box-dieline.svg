<svg xmlns="http://www.w3.org/2000/svg" width="331mm" height="246mm" version="1.1" viewBox="0 0 331 246"><title>Simple Invoicing Software Box Dieline</title><desc>Print-ready software box dieline with cut, fold, bleed, and safe-area guides.</desc><defs><style>.label{fill:#0d1b2e}.brand-copy,.brand-title,.label,.meta{font-family:&apos;Helvetica Neue&apos;,Arial,sans-serif}.brand-title{font-weight:700;fill:#f3f9ff}.brand-copy{fill:#d4e7ff}.meta{fill:#29415d}.cut,.fold{fill:none;stroke:#d12b2b;stroke-width:.35}.fold{stroke:#2576c9;stroke-width:.3;stroke-dasharray:2.2 1.4}.bleed,.safe{fill:none;stroke:#ca5f00;stroke-width:.25;stroke-dasharray:1.6 1.2}.safe{stroke:#2d8f43}</style><linearGradient id="panelGradient" x1="0" x2="1" y1="0" y2="1"><stop offset="0%" stop-color="#08111f"/><stop offset="65%" stop-color="#10233e"/><stop offset="100%" stop-color="#163359"/></linearGradient><linearGradient id="accentGlow" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#57d1c9"/><stop offset="100%" stop-color="#6be4ff"/></linearGradient></defs><rect width="330" height="245" x=".5" y=".5" class="bleed"/><rect width="120" height="180" x="18" y="33" fill="url(#panelGradient)"/><rect width="35" height="180" x="138" y="33" fill="#0b1930"/><rect width="120" height="180" x="173" y="33" fill="url(#panelGradient)"/><rect width="35" height="180" x="293" y="33" fill="#0b1930"/><circle cx="104" cy="86" r="36" fill="#1a3d6e" opacity=".36"/><circle cx="71" cy="145" r="50" fill="#0a2447" opacity=".42"/><rect width="84" height="4" x="36" y="168" fill="url(#accentGlow)" opacity=".9" rx="2"/><circle cx="236" cy="86" r="45" fill="#1d4f86" opacity=".34"/><circle cx="264" cy="160" r="30" fill="#2f7a8f" opacity=".26"/><rect width="78" height="4" x="199" y="168" fill="url(#accentGlow)" opacity=".9" rx="2"/><rect width="20" height="95" x="300" y="76" fill="#153556" opacity=".8" rx="1"/><text x="187" y="76" class="brand-title" font-size="9">SIMPLE INVOICING</text><text x="187" y="88" class="brand-copy" font-size="4.8">Stock and Billing Software</text><text x="187" y="106" class="brand-copy" font-size="4.4">Run inventory and invoicing without spreadsheet drag.</text><text x="187" y="124" class="brand-copy" font-size="4.2">- Product catalog and pricing</text><text x="187" y="132" class="brand-copy" font-size="4.2">- Live stock adjustment</text><text x="187" y="140" class="brand-copy" font-size="4.2">- Multi-line invoice generation</text><text x="187" y="148" class="brand-copy" font-size="4.2">- GST-ready tax fields</text><rect width="88" height="22" x="187" y="178" fill="#0a1b32" stroke="#57d1c9" stroke-width=".35" opacity=".75" rx="2"/><text x="193" y="187" class="brand-copy" font-size="4">Ideal for:</text><text x="193" y="194" class="brand-copy" font-size="4">Retail shops, distributors,</text><text x="193" y="200" class="brand-copy" font-size="4">and service-led businesses.</text><text x="311" y="191" class="brand-copy" font-size="3.3" text-anchor="middle" transform="rotate(-90 311 191)">SIDE PANEL</text><text x="318" y="190" class="brand-copy" font-size="3" text-anchor="middle" transform="rotate(-90 318 190)">STOCK + BILLING</text><text x="30" y="55" class="brand-title" font-size="7.2">WHY TEAMS CHOOSE IT</text><text x="30" y="69" class="brand-copy" font-size="4.2">Fast invoice creation with stock-aware validation.</text><text x="30" y="77" class="brand-copy" font-size="4.2">Ledger, cash-bank, and day-book workflows included.</text><text x="30" y="85" class="brand-copy" font-size="4.2">Responsive web interface for desktop and mobile.</text><text x="30" y="103" class="brand-title" font-size="6">WHAT IS INSIDE</text><text x="30" y="114" class="brand-copy" font-size="4.2">- Invoices, credit notes, and due tracking</text><text x="30" y="122" class="brand-copy" font-size="4.2">- Product inventory and stock movement logs</text><text x="30" y="130" class="brand-copy" font-size="4.2">- Customer ledgers and payment recording</text><text x="30" y="138" class="brand-copy" font-size="4.2">- Backup and restore tools</text><rect width="96" height="44" x="30" y="150" fill="#081827" stroke="#57d1c9" stroke-width=".35" opacity=".8" rx="2"/><text x="35" y="161" class="brand-copy" font-size="4.1">System overview:</text><text x="35" y="169" class="brand-copy" font-size="4">Frontend: React + Vite</text><text x="35" y="177" class="brand-copy" font-size="4">Backend: Python API</text><text x="35" y="185" class="brand-copy" font-size="4">Database: PostgreSQL</text><text x="156" y="189" class="brand-title" font-size="6" transform="rotate(-90 156 189)">SIMPLE INVOICING</text><text x="164" y="187" class="brand-copy" font-size="3.8" transform="rotate(-90 164 187)">Stock and Billing Software</text><text x="58" y="21" class="meta" font-size="4.5">Top tuck flap</text><text x="219" y="21" class="meta" font-size="4.5">Top tuck flap</text><text x="301" y="21" class="meta" font-size="3.8">Top side flap</text><text x="56" y="232" class="meta" font-size="4.5">Bottom lock flap</text><text x="215" y="232" class="meta" font-size="4.5">Bottom lock flap</text><text x="301" y="232" class="meta" font-size="3.8">Bottom side flap</text><rect width="15" height="180" x="3" y="33" fill="#f6f8fb"/><text x="10.5" y="120" class="label" font-size="4" text-anchor="middle" transform="rotate(-90 10.5 120)">GLUE FLAP</text><path d="M3 3 H328 V33 H18 V213 H328 V243 H3 V213 H18 V33 H3 Z" class="cut"/><line x1="18" x2="18" y1="3" y2="33" class="cut"/><line x1="138" x2="138" y1="3" y2="33" class="cut"/><line x1="173" x2="173" y1="3" y2="33" class="cut"/><line x1="293" x2="293" y1="3" y2="33" class="cut"/><line x1="328" x2="328" y1="3" y2="33" class="cut"/><line x1="18" x2="18" y1="213" y2="243" class="cut"/><line x1="138" x2="138" y1="213" y2="243" class="cut"/><line x1="173" x2="173" y1="213" y2="243" class="cut"/><line x1="293" x2="293" y1="213" y2="243" class="cut"/><line x1="328" x2="328" y1="213" y2="243" class="cut"/><line x1="18" x2="18" y1="33" y2="213" class="fold"/><line x1="138" x2="138" y1="33" y2="213" class="fold"/><line x1="173" x2="173" y1="33" y2="213" class="fold"/><line x1="293" x2="293" y1="33" y2="213" class="fold"/><line x1="3" x2="328" y1="33" y2="33" class="fold"/><line x1="3" x2="328" y1="213" y2="213" class="fold"/><rect width="110" height="170" x="23" y="38" class="safe"/><rect width="25" height="170" x="143" y="38" class="safe"/><rect width="110" height="170" x="178" y="38" class="safe"/><rect width="25" height="170" x="298" y="38" class="safe"/><rect width="82" height="22" x="242" y="6" fill="#fff" fill-opacity=".9" stroke="#1f2f43" stroke-width=".2"/><line x1="246" x2="259" y1="12" y2="12" class="cut"/><text x="261" y="13.5" class="label" font-size="3.6">Cut line</text><line x1="246" x2="259" y1="17" y2="17" class="fold"/><text x="261" y="18.5" class="label" font-size="3.6">Fold line</text><line x1="246" x2="259" y1="22" y2="22" class="safe"/><text x="261" y="23.5" class="label" font-size="3.6">Safe area</text><text x="6" y="249" class="label" font-size="0">.</text></svg>